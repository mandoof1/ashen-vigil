# Static hosting for ASHEN VIGIL: THE LAST BELL.
# The whole game is the static bundle in dist/ - there is no server process and no API key.
services:
  - type: web
    name: ashen-vigil
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
